<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POS License Admin</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
  </head>
  <body class="auth-body">
    <main class="auth-shell">
      <section class="auth-card">
        <div class="brand-row">
          <div class="brand-badge">P</div>
          <div>
            <p class="eyebrow">Owner Portal</p>
            <h1>POS License Admin</h1>
          </div>
        </div>

        <p class="auth-copy">
          Secure licensing and customer approval for the software owner only.
        </p>

        <form id="loginForm" class="stack-form">
          <label>
            <span>Email</span>
            <input id="email" type="email" placeholder="admin@yourdomain.com" required />
          </label>

          <label>
            <span>Password</span>
            <span class="password-input-wrap">
              <input id="password" type="password" placeholder="••••••••" required />
              <button type="button" class="password-toggle" data-password-toggle aria-label="Show password" title="Show password">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" /><circle cx="12" cy="12" r="3" /></svg>
              </button>
            </span>
          </label>

          <button type="submit" class="primary-btn">Sign in</button>
          <p id="authMessage" class="status-message" role="alert"></p>
        </form>
      </section>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/password-toggle.js"></script>
  </body>
</html>
