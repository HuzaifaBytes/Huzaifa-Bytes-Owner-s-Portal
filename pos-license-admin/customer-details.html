<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Account | POS License Admin</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Customer account</p>
          <h1 id="customerTitle" class="page-title">Customer</h1>
        </div>

        <div class="topbar-actions">
          <button class="secondary-btn" type="button" onclick="location.href='customers.html'">Back to customers</button>
          <button id="logoutBtn" class="ghost-btn" type="button">Logout</button>
        </div>
      </header>

      <section id="detailContainer" class="panel"></section>

      <section class="panel" style="margin-top: 1.25rem;">
        <div class="toolbar">
          <h2>Account and license</h2>
        </div>
        <div class="action-stack">
          <button class="primary-btn" type="button" data-license-action="activate">Activate / Set Duration</button>
          <button class="secondary-btn" type="button" data-license-action="extend">Extend Duration</button>
          <button class="secondary-btn" type="button" data-license-action="deactivate">Deactivate</button>
        </div>
      </section>

      <section class="panel" style="margin-top: 1.25rem;">
        <div class="toolbar">
          <h2>Local Database Identity (LDI)</h2>
        </div>
        <div id="installationContainer"></div>
        <p id="installationMessage" class="status-message" aria-live="polite"></p>
        <div class="action-stack">
          <button class="secondary-btn" type="button" data-installation-action="rebind">Approve rebind</button>
          <button class="secondary-btn" type="button" data-installation-action="block">Block installation</button>
        </div>
      </section>
    </main>

    <div id="licenseModal" class="modal" aria-hidden="true">
      <div class="modal-card">
        <h3 id="modalTitle">License action</h3>
        <form id="licenseForm" class="stack-form">
          <label id="licenseDaysGroup">
            <span>Duration</span>
            <select id="daysPreset">
              <option value="30">30 days</option>
              <option value="90">90 days</option>
              <option value="180">180 days</option>
              <option value="365">365 days</option>
              <option value="custom">Custom</option>
            </select>
          </label>
          <label id="customDayGroup" class="hidden">
            <span>Custom days (1-3650)</span>
            <input id="customDays" type="number" min="1" max="3650" step="1" value="30" />
          </label>
          <p id="expiryPreview" class="status-message">Confirm this account status change.</p>

          <div class="modal-actions">
            <button type="button" class="ghost-btn" id="cancelModal">Cancel</button>
            <button type="submit" class="primary-btn">Confirm</button>
          </div>
        </form>
      </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/licenses.js"></script>
  </body>
</html>
